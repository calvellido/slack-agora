# Agora's texts in English, the reference language: every other language has the same keys, and falls back to this
# file for any it doesn't have. `pnpm i18n` checks the translations and updates src/i18n/messages.ts from this file.
#
# Texts use ICU MessageFormat: {name} is a value, and {count, plural, one {# day} other {# days}} chooses by number.
# Three values are available everywhere: {bot}, the bot's name in Slack, and the {publishCommand} and
# {anonymousCommand} slash commands. Slack formatting (*bold*, <@user>, :emoji:) passes through unchanged.

common:
  cancel: "Cancel"
  save: "Save"
  close: "Close"
  back: "Back"

# The name the bot's notices in the team channel appear under, next to a robot icon, so they don't look like
# messages from the team.
notices:
  sender: "{bot} · bot"
  # Posted in the team channel when the bot starts on another version than it last ran. `previous` is unknown when the
  # version it ran before wasn't kept, and `notes` says whether there is a link to what changed.
  updated: "🆕 {bot} has been updated to version {version}{previous, select, unknown {} other {, from {previous}}}.{notes, select, yes { <{url}|What changed>} other {}}"
  wentBack: "↩️ {bot} went back to version {version}, from {previous}."

# Copying the files of messages: why one couldn't be copied, and the notices about it.
files:
  # Before the files someone sent, in their conversation's thread.
  attached: "📎 <@{user}> attached:"
  # Naming files without copying them: in the record of a post, and in the person's copy of what they wrote.
  included: "📎 With {count, plural, one {# file} other {# files}}: {list}"
  # Above the files other than images, which can only be uploaded as the bot itself.
  relayed: "Forwarded automatically: files from <@{user}>"
  relayedTitle: "{name} · from {person}"
  tooLarge: "{name}: it's larger than {max, number} MB"
  notDownloadable: "{name}: it can't be downloaded, such as a link to another service"
  needsMember: "{name}: {bot} isn't in that channel, where it can only post images. Invite it with /invite @{bot} to post other files"
  noPermission: "{name}: {bot} doesn't have permission for files yet. Paste the new manifest into the app settings and reinstall the app"
  failed: "{name}: it couldn't be copied"
  # In the team channel, about what someone sent.
  notRelayed: "📎 These files couldn't be forwarded here:\n{list}"
  # To the person, where they wrote: in their DM, in the form, or by their @mention.
  notReceived: "📎 These files didn't reach the {bot} team:\n{list}\nYou can share a link to them instead."
  # In the team channel, about a reply.
  notSent: "📎 These files weren't sent to the person:\n{list}"
  # In the record of a post.
  notPosted: "📎 These files weren't posted:\n{list}"
  anonymous: "📎 Files aren't sent in anonymous conversations: the person only gets the text."

# Why Slack refused to send or delete something, in words for the team; any other reason shows Slack's code.
errors:
  notInChannel: "{bot} isn't in that channel. Invite it with /invite @{bot}"
  archived: "that channel is archived"
  channelNotFound: "{bot} can't find that channel, which may have been deleted"
  restricted: "only some people can post in that channel"
  deactivated: "that person's account is deactivated"
  bot: "that's a bot, and bots don't get direct messages"
  tooLong: "the message is too long"
  rateLimited: "Slack is limiting how fast {bot} can post. Try again in a minute"
  missingScope: "{bot} is missing a permission. Paste the new manifest into the app settings and reinstall the app"

# The Slack app's settings, written to the manifest in the team's language.
manifest:
  description: "Write to the {bot} team, with your name or anonymously"
  writeShortcut:
    name: "Write to {bot}"
    description: "Write to the {bot} team with your name"
  writeCommand:
    description: "Write to the {bot} team with your name"
    hint: "[message]"
  anonymousShortcut:
    name: "Anonymous message to {bot}"
    description: "Write to the {bot} team without your name"
  publishShortcut:
    name: "Post as {bot}"
    description: "{bot} team only: post this message as {bot} in a channel or by direct message"
  publishCommand:
    description: "{bot} team only: post as {bot} in a channel or by direct message"
    hint: "[message]"
  anonymousCommand:
    description: "Write to the {bot} team without your name"
  # At the end of the About tab's text, which Slack shows without links.
  source: "This {bot} Slack application is open source, you can check its code at {address}. Contributions are welcome."

# Conversations by DM or @mention.
inbox:
  # To whoever wrote, by DM or where they mentioned the bot, when their message couldn't be relayed.
  relayFailed: "⚠️ Your message couldn't reach the {bot} team. Try sending it again in a few minutes."
  # Posted in the team channel.
  thread:
    dmHeader: "💬 Direct message from <@{user}>"
    mentionHeader: "🔔 <@{user}> mentioned {bot} in <#{channel}> · <{permalink}|view message>"
    followUp: "<@{user}> wrote:"
    replyHint: "To reply as {bot}, write in this thread and add :{sendEmoji}: to your message. Later edits are sent too."
    # In place of the copy of a DM the person deleted.
    deletedByPerson: "🗑️ <@{user}> deleted this message."
    # The same, when Slack doesn't say who.
    deletedByAuthor: "🗑️ Whoever wrote this message deleted it."
    lateRelay: "⏱️ Sent {date}, while {bot} was offline."
  # Sent by DM to whoever wrote to the bot.
  dm:
    ack: "Thanks for writing! The {bot} team has received your message and will reply here."
    lateAck: "Sorry for the delay: {bot} was offline for a while. Your message has now reached the team, and they will reply here."
    # Above the copy of what someone wrote in the form.
    written: "📝 You wrote to the {bot} team:"
    # When someone edits or deletes a DM, and the team's copy follows.
    editForwarded: "✏️ The {bot} team sees your edit too."
    deletedForTeam: "🗑️ Deleted for the {bot} team too."
    # When the team's copy couldn't follow: Slack refused the edit, the team had removed the copy, or some files stayed.
    editFailed: "✏️ This edit didn't reach the {bot} team, which still sees the message as it was before. To correct or add something, write a new message."
    editGone: "✏️ Your edit didn't reach the {bot} team, which had already removed this message from its channel. To tell them something, write a new message."
    deletedPartly: "🗑️ Deleted for the {bot} team, but {bot} couldn't delete some of its files from the team's channel. If you want them gone too, ask the team."
    # When the team's copy can't follow, as for DMs relayed by an earlier version.
    edited: "✏️ Edits don't reach the {bot} team, which has your message as you first sent it. To correct or add something, write a new message."
    deleted: "🗑️ Deleting a message here doesn't delete it for the {bot} team, which already has it. If you want them to delete it too, write and ask them."
  # Only seen by whoever mentioned the bot, where they did, when their message starts a conversation.
  mention:
    ack: "Thanks for writing! The {bot} team has received your message and will reply in your message's thread."
  # The form to write with your name, whose message is relayed as a DM.
  write:
    title: "Write to {bot}"
    intro: "The {bot} team will see your name. They reply by direct message, in {bot}'s *Messages* tab, where you can continue the conversation."
    message: "Message"
    attachments: "Files"
    attachmentsHint: "Up to {max, number} MB each."
    submit: "Send"
    anonymousHint: "To write anonymously, use `{anonymousCommand}` or *Anonymous messages* on {bot}'s *Home* tab."
    sent: "✅ Sent. The team will reply in {bot}'s *Messages* tab, where you have a copy of your message."
    # While the files are copied, which can take a while.
    sending: "⏳ Sending your message and its files to the team…"
    empty: "Write a message or attach files."
    cantSend: "These files can't be sent: {list}"
    sendFailed: "Couldn't send it. Try again in a few minutes."
  # The team's reactions in the team channel; all but the last are only seen by whoever reacted.
  reply:
    notInThread: "Only messages written inside a conversation's thread can be sent as {bot}."
    notAConversation: "This thread isn't a {bot} conversation."
    cannotSendBotMessage: "That message is from {bot}. Write your reply in the thread and add the reaction to your own message."
    emptyReply: "That message has no text to send."
    alreadySent: "This message was already sent."
    sendFailed: "Couldn't send the message: {reason}"
    alreadyDeleted: "It was already deleted."
    deleteFailed: "Couldn't delete it: {reason}"
    nothingToDelete: "There's nothing to delete here: :{deleteEmoji}: deletes what {bot} sent, added to a reply sent with :{sendEmoji}: or to the record of a post."
    # Editing a reply already sent.
    editSent: "✏️ Your edit was sent too."
    editFailed: "Couldn't send the edit: {reason}"
    editFilesOnly: "✏️ This reply was sent as files only, so text added later isn't sent: write it in a new reply and add :{sendEmoji}:."
    editEmpty: "✏️ Without text, the edit isn't sent: to remove what was sent, add :{deleteEmoji}: to it."
    deleted: "🗑️ <@{user}> deleted what {bot} had sent."
  # Posted in the team channel after the bot was down.
  backOnline: "✅ {bot} is running again after {duration} offline (since {since}). {recovered, plural, =0 {No direct messages arrived meanwhile.} one {It has relayed # direct message that arrived meanwhile.} other {It has relayed # direct messages that arrived meanwhile.}}"

# Posting as the bot.
publish:
  teamOnly: "This is only available to the {bot} team."
  form:
    title: "Post as {bot}"
    submit: "Post"
    close: "Cancel"
    channel: "Channel"
    people: "People (direct message)"
    message: "Message"
    hint: "Choose a channel, people or both. <#{teamChannel}> keeps a record of who posted it."
    originalFiles: "Files from the original message"
    cantPost: "These files can't be posted: {list}"
    attachments: "Files"
    attachmentsHint: "Up to {max, number} MB each. In a public channel {bot} isn't in, only images are posted."
    needTarget: "Choose a channel or at least one person."
    empty: "Write a message or attach files."
    notMember: "{bot} isn't in this private channel. Invite it first with /invite @{bot}."
    archived: "This channel is archived."
  # The records left in the team channel.
  record:
    dmStarted: "📤 <@{poster}> wrote to <@{user}> as {bot}:"
    posted: "📣 <@{poster}> posted as {bot} in <#{channel}> · <{permalink}|view message>"
    # When Slack can't give a link to the post.
    postedNoLink: "📣 <@{poster}> posted as {bot} in <#{channel}>"
    failed: "⚠️ Couldn't send as {bot} to {target} (requested by <@{poster}>): {reason}"
    nothingPosted: "⚠️ Nothing was sent as {bot} to {target} (requested by <@{poster}>):\n{list}"
  # The form once sent, for whoever posted: how it went for each channel or person.
  done:
    sending: "⏳ Sending…"
    posted: "✅ Posted in {target} · <{permalink}|view message>"
    sent: "✅ Sent to {target}"
    nothing: "⚠️ Nothing was sent to {target}:\n{list}"
    failed: "⚠️ Couldn't send to {target}: {reason}"
    record: "To delete it, add :{deleteEmoji}: to its record in <#{teamChannel}>."

home:
  # Under the bot's name, when the deployment has no ABOUT text.
  intro: "Write to the {bot} team, with your name or anonymously."
  contactTitle: "Write to the team"
  # Only when the deployment lists them: above the photos and names of the people in the team channel.
  members: "The team members are:"
  named: |-
    💬 *With your name*
    Write from {bot}'s *Messages* tab or with this button. The team sees who you are and replies there, by direct message.
  namedButton: "Write with your name"
  # Only shown when the deployment has a command for it.
  namedHint: "You can also use `{command}` from any channel."
  deliveryHint: "{bot} marks every message it gets with :incoming_envelope:. If you don't see it, {bot} is offline for a moment: your message is not lost and reaches the team as soon as it is back."
  anonymous: |-
    🕶️ *Without your name*
    Open *Anonymous messages*: that's where you write to the team and read its replies. Nothing stays in your Slack messages.
  anonymousButton: "Anonymous messages"
  anonymousHint: "Your anonymous conversations never appear on this tab, only in that window. You can also open it with `{anonymousCommand}` from any channel."
  # Only shown to team members.
  team:
    title: "For the {bot} team"
    onlyTeam: "👀 Only members of <#{teamChannel}> see this section."
    conversations: |-
      *🧵 Conversations*
      Every conversation with {bot} is a thread in <#{teamChannel}>, anonymous ones too.
    reply: |-
      *:{sendEmoji}: Replying*
      Write in the thread and add :{sendEmoji}: to your message. {bot} sends it and marks it with :white_check_mark:. Later edits are sent too.{anonymous, select, encrypted { Anonymous conversations are read and answered with *Open*, on their first message.} other {}}
    delete: |-
      *:{deleteEmoji}: Deleting*
      Add :{deleteEmoji}: to the record in <#{teamChannel}> of what {bot} sent.
    # ways: which of the command and the message shortcut this deployment has.
    publish: |-
      *📣 Posting*
      Post in a channel or write to people as {bot} with the button below{ways, select, both {, `{publishCommand}`, or the shortcut in a message's *⋯* menu} command { or `{publishCommand}`} shortcut { or the shortcut in a message's *⋯* menu} other {}}.
    publishButton: "Post as {bot}"
    updatesButton: "Check for updates"
    # The window that button opens, saying whether a newer release of Agora is out. It is installed on the bot's
    # machine, never from Slack.
    updates:
      title: "Updates"
      checking: "Checking for a newer release…"
      newer: "{bot} is running version {current}, and *version {next}* is out: <{url}|what changed>."
      latest: "{bot} is running version {current}, the latest {major}.x release."
      newMajor: "Version {version} is out too, a new major version, which can need changes: <{url}|read its notes> before updating to it."
      howTo: "Whoever runs {bot} installs it on its machine: with `update apply` in the bot's console, or `docker compose pull && docker compose up -d` with Docker. Nothing is installed from Slack."
      failed: "GitHub couldn't be reached to check for updates. Try again in a while."
  # At the bottom, for everyone.
  source: "This Slack app is running an instance of Agora, an open source project. Anyone can read its code at <{url}|{label}>, and see how it works. If you find something to improve, contributions are welcome."
  # The version that is running, under that.
  version: "Version {version}"

anonymous:
  unavailable: "This conversation has ended."
  sendFailed: "Couldn't send it. Try again in a few minutes."
  # The "Anonymous messages" window: the viewer's own conversations.
  window:
    title: "Anonymous messages"
    intro: "Write to the {bot} team without your name. The team gets your messages anonymously, and its replies show up only here, in this window. Nothing stays in your Slack messages."
    new: "New conversation"
    empty: "You don't have any anonymous conversations."
    conversations: "*Your conversations*"
    open: "Open"
    newReply: "🆕 New reply"
    started: "Started: {date}"
    last: "Last message: {date}"
  # One conversation, opened from the window.
  conversation:
    name: "*Anonymous conversation*"
    title: "Anonymous conversation"
    endedByTeam: "🔒 Ended by the team. It will disappear from here in {days, plural, one {# day} other {# days}}."
    expired: "🔒 Ended after inactivity. It will disappear from here in {days, plural, one {# day} other {# days}}."
    you: "🕶️ *You*"
    new: "🆕"
    # Beside the time of a reply the team edited after sending it, or of a message the person edited.
    editedReply: "edited"
    editedMessage: "edited"
    # In place of a message deleted after it was sent, without its text.
    deletedReply: "Reply deleted"
    deletedMessage: "Message deleted"
    # The menu beside each of the person's own messages while the conversation is open.
    editMessage: "Edit"
    deleteMessage: "Delete"
    editTitle: "Edit message"
    deleteTitle: "Delete message"
    deleteMessageConfirm: "The team won't see it any more, though it may have read it already."
    changeFailed: "Couldn't change it. Try again in a few minutes."
    # Above the messages a window shows, when there are more than fit.
    earlier: "{count, plural, one {# earlier message} other {# earlier messages}}"
    later: "Later messages"
    unavailable: "_This message is no longer available._"
    reply: "Your reply"
    send: "Send"
    end: "End conversation"
    delete: "Delete conversation"
    deleteConfirmTitle: "Delete the conversation?"
    deleteConfirm: "{bot} will delete your messages from the team's channel and forget that this conversation is yours."
    deleteConfirmButton: "Delete"
    deleted: "{bot} is deleting your messages from the team's channel and no longer keeps anything linking you to the conversation."
  # Ending a conversation, from the window.
  end:
    intro: "Once it ends, nobody can write in it any more and {bot} forgets it's yours, so you won't be able to see it again."
    deleteLabel: "Your messages"
    deleteOption: "Also delete my messages from the team's channel"
    # In an encrypted conversation the team's replies are the bot's too, so they go with the rest.
    deleteHint: "{encrypted, select, yes {The team will no longer see what you wrote, nor its replies to you.} other {The team will no longer see what you wrote. Its replies stay in the channel unless each team member deletes their own.}}"
    submit: "End"
    done: "You ended the conversation. {bot} no longer keeps anything linking you to it."
    doneDeleted: "You ended the conversation and {bot} is deleting your messages from the team's channel. It no longer keeps anything linking you to it."
  # The form to start a conversation.
  form:
    title: "Anonymous message"
    submit: "Send"
    intro: "The {bot} team will get your message anonymously, without your name. Replies will show up in {bot}'s *Anonymous messages*, where you can continue the conversation."
    message: "Message"
    privacy: |-
      • What you say and how you write can identify you: think about which details you include.
      • The team can't tell whether two anonymous conversations come from the same person.
      • {bot} doesn't notify you of replies, because a notification would leave a trace in your messages. Come back here to see them.
      • {bot} doesn't store your name with the message, only a scrambled fingerprint to show you the replies. It's deleted once the conversation ends and you can no longer see it, and when you end it you can also delete your messages from the team's channel.
    # One more point of the same list, in the form, when conversations are encrypted.
    encrypted: "• {bot} keeps what you write encrypted, outside Slack's messages, so it isn't in the workspace's exports. It deletes it {days, plural, one {# day} other {# days}} after the conversation ends."
    sent: |-
      ✅ Sent. The team will get it without your name.

      Its replies will show up in {bot}'s *Anonymous messages*.
    empty: "The message is empty."
    tooMany: "You already have {max, plural, one {# open anonymous conversation} other {# open anonymous conversations}}. End one to start another."
  # The team's side, in the team channel.
  team:
    header: "🕶️ *Anonymous message*"
    followUp: "🕶️ The person wrote:"
    openStatus: "To reply, write in the thread and add :{sendEmoji}: to your message. The person will see it in {bot}'s *Anonymous messages*, including later edits."
    # An encrypted conversation: its thread only holds placeholders, and the team reads and replies from a window.
    openStatusEncrypted: "Read it and reply with *Open*, not in the thread: what you write in the thread isn't encrypted, so don't quote the person's messages there."
    locked: "🔒 Its text is encrypted."
    openButton: "Open"
    followUpLocked: "🕶️ The person wrote again."
    replied: "🔒 <@{user}> replied."
    # In place of, or under, one of the person's messages they deleted or edited from their window.
    personDeleted: "🗑️ The person deleted this message."
    personEdited: "✏️ The person edited this message."
    # In place of a reply's placeholder, once someone in the team edited it, or deleted it.
    repliedEdited: "🔒 <@{user}> replied · edited by <@{editor}>"
    repliedDeleted: "🗑️ <@{user}> replied · deleted by <@{deleter}>"
    # The delete emoji on one of the person's messages in an encrypted thread.
    nothingToDelete: "Here, :{deleteEmoji}: withdraws a reply, on its placeholder. The person's messages are theirs to delete, or go with the whole conversation."
    # The send emoji on a message in the thread of an encrypted conversation.
    replyFromWindow: "This anonymous conversation is answered with *Open*, on its first message: its text is encrypted, and messages in the thread aren't."
    # After the status, once the conversation's key is destroyed.
    textExpired: "Its text was deleted {days, plural, one {# day} other {# days}} after it ended."
    endButton: "End conversation"
    endConfirmTitle: "End the conversation?"
    endConfirm: "The person won't be able to write in it any more, and will see it as ended for {days, plural, one {# day} other {# days}}."
    endConfirmButton: "End"
    endedBy: "🔒 <@{user}> ended the conversation."
    endedByPerson: "🔒 The person ended the conversation."
    endedByTeam: "🔒 The team ended the conversation."
    expired: "🔒 Conversation ended automatically after {days, plural, one {# day} other {# days}} without activity."
    deletableStatus: "The person can no longer see this conversation. {bot} can delete everything it posted in it from the channel."
    deleteButton: "Delete conversation"
    deleteConfirmTitle: "Delete the conversation?"
    deleteConfirm: "{encrypted, select, yes {{bot} will delete what it posted in this thread: the person's messages and the team's replies. Only what team members wrote in the thread themselves stays.} other {{bot} will delete what it posted in this thread, including the person's messages. The team's replies can only be deleted by whoever wrote them.}}"
    deleteConfirmButton: "Delete"
    deletedByTeam: "{encrypted, select, yes {Deleted, the team's replies included. Only what team members wrote in the thread themselves stays.} other {Deleted. The team's replies left in the thread can only be deleted by whoever wrote them.}}"
    deletedByPerson: "{encrypted, select, yes {🗑️ The person deleted this conversation, the team's replies included. Only what team members wrote in the thread themselves stays.} other {🗑️ The person deleted their messages from this conversation. The team's replies can only be deleted by whoever wrote them.}}"
    notDeletable: "The person can still see this conversation, so it can't be deleted yet."
    replyClosed: "This anonymous conversation has ended."
    alreadyClosed: "This conversation had already ended."
    # When a reply in a thread that isn't encrypted is withdrawn: the team member's message itself can't change.
    replyDeleted: "🗑️ <@{user}> withdrew the reply. The person won't see it any more, though they may have read it already."
  # The team's window on an encrypted conversation, opened from its thread.
  teamWindow:
    intro: "The person reads this in their *Anonymous messages* window. What you write here is encrypted; what you write in the thread isn't."
    ended: "🔒 This conversation has ended, so it can't be replied to."
    person: "🕶️ *The person*"
    edit: "Edit"
    delete: "Delete"
    editedBy: "edited by <@{user}>"
    # In place of a deleted message, as the team's window shows it.
    deletedBy: "deleted by <@{user}>"
    deletedByPerson: "Message deleted by the person"
    editTitle: "Edit reply"
    deleteTitle: "Delete reply"
    deleteConfirm: "The person won't see it any more, though they may have read it already."
    expired: "🔒 Its text is no longer available: {bot} deletes it {days, plural, one {# day} other {# days}} after a conversation ends."
