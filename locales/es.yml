home:
  intro: "Escribe al equipo de {bot}, con tu nombre o de forma anónima."
  contactTitle: "Escribe al equipo"
  named: |-
    💬 *Con tu nombre*
    Escribe desde la pestaña *Mensajes* de {bot} o con este botón. El equipo ve quién eres y te responde allí, por mensaje directo.
  namedButton: "Escribir con tu nombre"
  namedHint: "También puedes usar `{command}` desde cualquier canal."
  deliveryHint: "{bot} marca cada mensaje que recibe con :incoming_envelope:. Si no lo ves, {bot} está sin conexión un momento: tu mensaje no se pierde y llegará al equipo en cuanto vuelva."
  anonymous: |-
    🕶️ *Sin tu nombre*
    Abre *Mensajes anónimos*: ahí escribes al equipo y lees sus respuestas. No queda nada en tus mensajes de Slack.
  anonymousButton: "Mensajes anónimos"
  anonymousHint: "Tus conversaciones anónimas nunca aparecen en esta pestaña, solo en esa ventana. También puedes abrirla con `{anonymousCommand}` desde cualquier canal."
  team:
    title: "Para el equipo de {bot}"
    onlyTeam: "👀 Solo los miembros de <#{teamChannel}> ven esta sección."
    conversations: |-
      *🧵 Conversaciones*
      Cada conversación con {bot} es un hilo en <#{teamChannel}>, también las anónimas.
    reply: |-
      *:{sendEmoji}: Responder*
      Escribe en el hilo y añade :{sendEmoji}: a tu mensaje. {bot} lo envía y lo marca con :white_check_mark:.
    delete: |-
      *:{deleteEmoji}: Borrar*
      Añade :{deleteEmoji}: al registro en <#{teamChannel}> de lo que {bot} envió.
    publish: |-
      *📣 Publicar*
      Publica en un canal o escribe a personas como {bot} con el botón de abajo{ways, select, both {, `{publishCommand}` o el atajo del menú *⋯* de un mensaje} command { o `{publishCommand}`} shortcut { o el atajo del menú *⋯* de un mensaje} other {}}.
    publishButton: "Publicar como {bot}"
  source: "{bot} es una instancia de Agora, un proyecto de código abierto. Cualquiera puede leer su código en <{url}|{label}>, y ver cómo funciona. Si encuentras algo que mejorar, las contribuciones son bienvenidas."
  version: "Versión {version}"

