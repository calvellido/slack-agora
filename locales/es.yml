# Textos de Agora en español. Mismas claves que en.yml; lo que falte aquí se muestra en inglés.
# Lenguaje neutro: sin formas con género para las personas, y sin «vosotros», para que se lea bien en cualquier
# variante del español.

common:
  cancel: "Cancelar"
  close: "Cerrar"
  back: "Volver"

notices:
  sender: "{bot} · bot"

manifest:
  description: "Escribe al equipo de {bot}, con tu nombre o de forma anónima"
  writeShortcut:
    name: "Escribir a {bot}"
    description: "Escribe al equipo de {bot} con tu nombre"
  writeCommand:
    description: "Escribir al equipo de {bot} con tu nombre"
    hint: "[texto del mensaje]"
  anonymousShortcut:
    name: "Mensaje anónimo a {bot}"
    description: "Escribe al equipo de {bot} de forma anónima"
  publishShortcut:
    name: "Publicar como {bot}"
    description: "Solo para el equipo de {bot}: publica este mensaje como {bot} en un canal o por mensaje directo"
  publishCommand:
    description: "Solo para el equipo de {bot}: publicar como {bot} en un canal o por mensaje directo"
    hint: "[texto del mensaje]"
  anonymousCommand:
    description: "Escribir al equipo de {bot} sin tu nombre"
  source: "Esta aplicación de Slack de {bot} es de código abierto, puedes revisarla en {address}. Las contribuciones son bienvenidas."

