    failed: "⚠️ No se pudo enviar como {bot} a {target} (lo pidió <@{poster}>): `{error}`"

home:
  contact: |-
    *¿Quieres hablar con el equipo de {bot}?*
    • *Con tu nombre:* escribe desde la pestaña *Mensajes* de {bot}. El equipo ve quién eres y te responde allí.
    • *Sin tu nombre:* abre *Mensajes anónimos*. Ahí escribes al equipo y lees sus respuestas.
  deliveryHint: "{bot} marca cada mensaje que recibe con :incoming_envelope:. Si no lo ves, {bot} está sin conexión un momento: tu mensaje no se pierde y llegará al equipo en cuanto vuelva."
  anonymousButton: "Mensajes anónimos"
  anonymousHint: "Tus conversaciones anónimas nunca aparecen en esta pestaña, solo en esa ventana. También puedes abrirla con `{anonymousCommand}` desde cualquier canal."
  team: |-
    *Para el equipo de {bot}*
    • Cada conversación con {bot} aparece en <#{teamChannel}> como un hilo, también las anónimas.
    • Para responder, escribe en el hilo y añade :{sendEmoji}: a tu mensaje. {bot} lo envía y lo marca con :white_check_mark:.
    • Para borrar algo que {bot} envió, añade :{deleteEmoji}: a su mensaje de registro en <#{teamChannel}>.
    • Para publicar o escribir a alguien como {bot}, usa `{publishCommand}` o el atajo de mensaje para publicar como {bot}.

