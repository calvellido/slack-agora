  dm:
    ack: "¡Gracias por escribir! El equipo de {bot} ha recibido tu mensaje y te responderá por aquí."
    lateAck: "Perdona el retraso: {bot} estuvo sin conexión un rato. Tu mensaje ya ha llegado al equipo, que te responderá por aquí."
    written: "📝 Escribiste al equipo de {bot}:"
  write:
    title: "Escribir a {bot}"
    intro: "El equipo de {bot} verá tu nombre. Te responderá por mensaje directo, en la pestaña *Mensajes* de {bot}, donde puedes continuar la conversación."
    message: "Mensaje"
    submit: "Enviar"
    anonymousHint: "Para escribir de manera anónima, usa `{anonymousCommand}` o *Mensajes anónimos* en la pestaña *Inicio* de {bot}."
    sent: "✅ Enviado. El equipo te responderá en la pestaña *Mensajes* de {bot}, donde tienes una copia de tu mensaje."
    empty: "El mensaje está vacío."
    sendFailed: "No se ha podido enviar. Inténtalo de nuevo en unos minutos."
  reply:
    notInThread: "Solo se pueden enviar como {bot} los mensajes escritos dentro del hilo de una conversación."
    notAConversation: "Este hilo no corresponde a ninguna conversación de {bot}."
    cannotSendBotMessage: "Ese mensaje es de {bot}. Escribe tu respuesta en el hilo y añade la reacción a tu mensaje."
    emptyReply: "Ese mensaje no tiene texto que enviar."
    filesNotSent: "Se ha enviado el texto, pero {bot} todavía no puede enviar archivos."
    alreadySent: "Este mensaje ya se envió."
    sendFailed: "No se pudo enviar el mensaje: `{error}`"
    alreadyDeleted: "Ya estaba eliminado."
    deleteFailed: "No se pudo eliminar: `{error}`"
    deleted: "🗑️ <@{user}> eliminó lo que {bot} había enviado."
  backOnline: "✅ {bot} vuelve a estar en marcha tras {duration} sin conexión (desde {since}). {recovered, plural, =0 {No llegó ningún mensaje directo mientras tanto.} one {Ha reenviado # mensaje directo que llegó mientras tanto.} other {Ha reenviado # mensajes directos que llegaron mientras tanto.}}"

publish:
