# Agora with Docker Compose: put this file and .env in a folder, and run `docker compose up -d` there. GUIDE.md has
# the rest of the commands.
services:
  agora:
    image: ghcr.io/calvellido/slack-agora:3
    restart: unless-stopped
    volumes:
      - ./.env:/app/.env:ro
      - data:/app/data

volumes:
  data:
