# Example manifest, with the defaults of .env.example. Generated by `pnpm manifest --example`: don't edit it
# by hand. For your own app, set .env and run `pnpm manifest`, which writes manifest.yml.

display_information:
  name: Agora
  description: Write to the Agora team, with your name or anonymously
  background_color: "#212121"
features:
  app_home:
    home_tab_enabled: true
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Agora
    always_online: true
  shortcuts:
    - name: Anonymous message to Agora
      type: global
      callback_id: anon_new
      description: Write to the Agora team without your name
    - name: Post as Agora
      type: message
      callback_id: publish_as_bot
      description: Post this message as Agora in a channel or by direct message
  slash_commands:
    - command: /agora-post
      description: Post as Agora in a channel or by direct message
      usage_hint: "[message]"
      should_escape: false
    - command: /agora-anon
      description: Write to the Agora team without your name
      should_escape: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:read
      - chat:write
      - chat:write.public
      - commands
      - groups:history
      - groups:read
      - im:history
      - im:read
      - im:write
      - reactions:read
      - reactions:write
      - users:read
settings:
  event_subscriptions:
    bot_events:
      - app_home_opened
      - app_mention
      - message.im
      - reaction_added
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
